function jm(e){const r=J.getBoundingClientRect(),m=r.width*.4;let dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2;const l=Math.hypot(dx,dy);if(l>m){dx*=m/l;dy*=m/l}jx=dx/m;jy=dy/m;K.style.transform=`translate(${dx}px,${dy}px)`}
J.addEventListener('pointerdown',e=>{jid=e.pointerId;J.setPointerCapture(jid);jm(e)});
J.addEventListener('pointermove',e=>{if(e.pointerId==jid)jm(e)});
const ju=e=>{if(e.pointerId==jid){jid=null;jx=jy=0;K.style.transform=''}};J.addEventListener('pointerup',ju);J.addEventListener('pointercancel',ju);
let lp={};R.domElement.addEventListener('pointerdown',e=>{lp[e.pointerId]=[e.clientX,e.clientY]});
R.domElement.addEventListener('pointermove',e=>{const p=lp[e.pointerId];if(!p||busy)return;yaw-=(e.clientX-p[0])*.006;pitch=Math.max(.05,Math.min(1.2,pitch+(e.clientY-p[1])*.005));lp[e.pointerId]=[e.clientX,e.clientY]});
const pe=e=>delete lp[e.pointerId];R.domElement.addEventListener('pointerup',pe);R.domElement.addEventListener('pointercancel',pe);
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code=='Escape')pause();if(e.code=='KeyV'&&!busy)fp=!fp;if(dig&&!e.repeat){if(e.code=='Digit1')ds('s');if(e.code=='Digit2')ds('b')}else if(!busy&&!menu&&!dig&&/^Digit[1-9]$/.test(e.code)){const s=hbr.sl[+e.code[5]-1];if(s!==undefined)eqp(s)}if(['KeyE','Space','Enter'].includes(e.code)&&!e.repeat&&!menu&&!busy)act()});
addEventListener('keyup',e=>keys[e.code]=0);

/* UI */
function card(h,btns){busy=true;const c=$('#c');c.innerHTML=h;(btns||[]).forEach(([t,f,k,cl])=>{const b=document.createElement('button');b.className='bt '+(cl||'');b.textContent=t;b.onclick=()=>{au();sfx.click();if(!k){closeC()}f&&f()};c.appendChild(b)});$('#m').classList.add('on');$('#m').scrollTop=0}
function closeC(){$('#m').classList.remove('on');busy=false}
function toast(t){const e=$('#tt');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2600)}
function ach(id,t){if(!st.ach.includes(id)){st.ach.push(id);toast('🏆 Conquista: '+t);save()}}
function hud(){const L=LV[st.lvl],n=coins.filter(c=>!c.visible).length;
 $('#q').innerHTML=`<b>Fase ${st.lvl+1}: ${L.n}</b>`+(!st.tools?'Pegue a pá e o pincel no altar de feixe branco':!mapF?'Entre pela PORTA ROXA do labirinto, dentro do templo, e ache o mapa. Cuidado com as armadilhas!':found<2?`Escave as relíquias (${found}/2)`:solved?'Concluída!':'Leve as relíquias ao altar azul e resolva o enigma')+`<br>Missão extra: moedas ${n}/3`;
 $('#sc').textContent='⭐ '+st.score;hbr()}
function artCard(a,extra){return `<h2>🏺 ${a[0]}</h2><p><b>Civilização:</b> ${a[1]}</p><p><b>Período:</b> ${a[2]}</p><p><b>Função:</b> ${a[3]}</p><p><b>Importância:</b> ${a[4]}</p><p><b>Curiosidade:</b> ${a[5]}</p>`+(extra||'')}
function inv(){card('<h2>🎒 Suas relíquias ('+st.inv.length+'/8)</h2><div class="inv" id="iv"></div>',[['Fechar',0,0]]);
 const d=$('#iv');for(let i=0;i<8;i++){const b=document.createElement('button');b.className='bt';b.textContent=st.inv.includes(i)?ART[i][0]:'❔ Não descoberta';b.onclick=()=>st.inv.includes(i)&&card(artCard(ART[i]),[['Voltar',inv]]);d.appendChild(b)}}
function how(){card(`<h2>Como jogar</h2><p><b>Mover:</b> ${touch?'joystick':'WASD ou setas'}. <b>Câmera:</b> ${touch?'arraste o dedo':'arraste o mouse'}.</p><p>Siga os <b>feixes de luz dourados</b>: são pontos de escavação. Aproxime-se e use o botão de ação${touch?'':' (tecla E)'}.</p><p>Pegue as ferramentas no altar perto do início. O resto, descubra você mesmo!</p><p>Câmera: botão 👁 ou tecla V alterna primeira e terceira pessoa.</p><p>Com as 2 relíquias, vá ao <b>feixe azul</b> (altar) e resolva o enigma. Moedas douradas dão pontos extras.</p><p>${touch?'':'ESC pausa. '}O progresso é salvo neste aparelho.</p>`,[['Voltar',mainMenu]])}
function settings(){card(`<h2>Configurações</h2><p>Volume</p><input type="range" min="0" max="1" step=".05" value="${set.vol}" style="width:100%" oninput="set.vol=+this.value;vol();save()"><p><label><input type="checkbox" ${set.mute?'checked':''} onchange="set.mute=this.checked;vol();save()"> Silenciar</label></p><p>Qualidade gráfica (vale ao reiniciar a fase)</p><select style="width:100%;padding:10px;font-size:16px" onchange="set.q=this.value;save()"><option value="auto">Automática</option><option value="low" ${set.q=='low'?'selected':''}>Baixa (celulares fracos)</option><option value="high" ${set.q=='high'?'selected':''}>Alta (com sombras)</option></select>`,[['Apagar progresso',()=>{if(confirm('Apagar todo o progresso?')){st={lvl:0,score:0,inv:[],ach:[]};save();load(0)}mainMenu()},1],['Voltar',()=>menu?mainMenu():pause(1)]])}
function mp(){return mpMenu()}
function mpOld(){card(`<h2>🌍 Multiplayer</h2><p>As salas privadas com código e o mundo compartilhado em tempo real (jogadores reais, em aparelhos diferentes) serão ligados na <b>próxima etapa</b>, depois da publicação do jogo.</p><p>Por enquanto, este botão não conecta ninguém e nenhum jogador falso é simulado.</p>`,[['Voltar',mainMenu]])}
function mainMenu(){menu=true;$('#act').style.display=$('#dg').style.display='none';
 card(`<h1>RELÍQUIAS<br>DO PASSADO</h1><div class="s">A Grande Expedição</div>`,[[(st.lvl||st.inv.length?'JOGAR (fase '+(st.lvl+1)+')':'JOGAR'),play,0,'m'],['MULTIPLAYER',mp],['REINICIAR JOGO',rst],['COMO JOGAR',how],['CONFIGURAÇÕES',settings]])}
function play(){au();menu=false;load(st.lvl);card(`<h2>Fase ${st.lvl+1}: ${LV[st.lvl].n}</h2><p>${LV[st.lvl].i}</p><p><b>Como avançar:</b></p><p>1. Pegue a pá e o pincel no altar branco (fase 1).</p><p>2. Entre no templo e atravesse o labirinto até achar o mapa antigo. Cuidado com as armadilhas!</p><p>3. Siga os feixes dourados e escave as relíquias.</p><p>4. Leve-as ao altar azul e responda o enigma.</p><p>A seta no canto da tela mostra para onde ir.</p>`,[['Começar',0,0,'m']])}
function pause(r){if(menu||dig||(busy&&!r&&!$('#m').classList.contains('on')))return;if(busy&&!r){closeC();return}
 card('<h2>⏸ Pausa</h2>',[['Continuar',0,0,'m'],['Reiniciar jogo',rst,1],['Reiniciar fase',()=>{st.score=base.s;st.inv=base.inv;load(st.lvl);toast('Fase reiniciada')}],['Configurações',settings,1],['Menu principal',mainMenu]])}
$('#bp').onclick=()=>pause();$('#bv').onclick=()=>{fp=!fp;toast(fp?'Primeira pessoa':'Terceira pessoa')};$('#bi').onclick=()=>{if(!busy&&!menu)inv()};

/* AÇÕES */
function act(){if(!near||dig)return;au();if(near.k=='t')return getTools(near);if(near.k=='m')return getMap(near);if(near.k=='d'){if(!st.tools)return toast('Você precisa de ferramentas! Procure o altar de feixe branco.');startDig(near)}else if(found<2)toast('Antes, escave as 2 relíquias!');else if(!solved)enigma()}
$('#act').addEventListener('pointerdown',e=>{e.preventDefault();if(!busy)act()});
function startDig(it){yaw=Math.atan2(P.position.x-it.x,P.position.z-it.z);pitch=.95;vmDig=true;vmSet(shovel(),1);dig={it,p:0};$('#act').style.display='none';$('#dg').style.display='block';dgu()}
function dgu(m){$('#dgt').innerHTML=m||(dig.p<4?'Há algo enterrado aqui. Qual ferramenta usar?':'Algo apareceu! Seja delicado…');$('#bar i').style.width=dig.p/8*100+'%'}
$('#dgs').addEventListener('pointerdown',e=>{e.preventDefault();ds('s')});$('#dgb').addEventListener('pointerdown',e=>{e.preventDefault();ds('b')});
$('#dg').insertAdjacentHTML('beforeend','<button class="bt" id="dgc" style="font-size:13px;padding:8px">Cancelar</button>');$('#dgc').onclick=()=>{if(dig){$('#dg').style.display='none';dig=null}};
function ds(w){if(!dig)return;au();if(dig.p<4&&w!='s'){sfx.bad();dgu('O pincel não adianta: a terra está dura e compactada.');return}if(dig.p>=4&&w!='b'){sfx.bad();dgu('Cuidado! A pá pode quebrar o achado. Use algo delicado.');return}dig.tool=w;vmSet(w=='s'?shovel():brush(),1);dig.tm=clk.elapsedTime;w=='s'?sfx.dig():sfx.brush();dig.p++;dig.it.m.scale.setScalar(Math.max(.15,1-dig.p/8));dig.it.rm.position.y=-.7+dig.p/8*1.5;burst(dig.it.x,dig.it.z,6);
 if(dig.p>=8){const it=dig.it;it.done=true;world.remove(it.m,it.b,it.rm);burst(it.x,it.z,24);$('#dg').style.display='none';dig=null;found++;if(!st.inv.includes(it.a)){st.inv.push(it.a);st.score+=100}sfx.ok();hud();save();ach('r1','Primeira relíquia');
  if(found==2)toast('Agora vá ao altar (feixe azul)!');card('<h2 style="text-align:center">✨ Relíquia descoberta! +100</h2>'+artCard(ART[it.a]),[['Continuar',0,0,'m']])}else dgu()}
function enigma(){const q=LV[st.lvl].q;card(`<h2>🗿 O enigma do altar</h2><p>${q.t}</p>`,[]);
 q.o.forEach((o,i)=>{const b=document.createElement('button');b.className='bt';b.textContent=o;b.onclick=()=>{au();if(i==q.c){sfx.ok();st.score+=200;done()}else{sfx.bad();b.style.opacity=.4;b.disabled=true;const p=document.createElement('p');p.innerHTML='Quase! Dica: '+q.h;$('#c').appendChild(p)}};$('#c').appendChild(b)});
 const x=document.createElement('button');x.className='bt';x.textContent='Voltar';x.onclick=closeC;$('#c').appendChild(x)}
function done(){solved=true;ach('f'+st.lvl,'Fase '+(st.lvl+1)+' concluída');hud();
 if(st.lvl<3){const n=st.lvl+1;card(`<h2 style="text-align:center">🎉 Fase concluída!</h2><p>Correto! +200 pontos. Pontuação total: <b>${st.score}</b>.</p>`,[['Próxima fase',()=>{st.lvl=n;save();play()},0,'m'],['Menu principal',()=>{st.lvl=n;save();mainMenu()}]])}
 else{ach('all','Grande Descobridor');card(`<h1>🏛️ Expedição completa!</h1><p>Você reuniu ${st.inv.length} relíquias da Grécia e de Roma e fez <b>${st.score}</b> pontos.</p>`,[['Ver relíquias',inv,0],['Jogar de novo',()=>{st={lvl:0,score:0,inv:[],ach:st.ach};save();play()},0,'m'],['Menu principal',mainMenu]])}}

/* LOOP */
const clk=new T.Clock();let sp=0,stp=0,ang=0;
function resize(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}addEventListener('resize',resize);resize();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.05),t=clk.elapsedTime;
 if(menu){ang+=dt*.15;C.position.set(Math.sin(ang)*30,12,Math.cos(ang)*30-8);C.lookAt(0,4,-14);P.visible=false;VM.visible=false}
 else{P.visible=true;let ix=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+jx,iy=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-jy;
  if(busy||dig)ix=iy=0;const l=Math.hypot(ix,iy);if(l>1){ix/=l;iy/=l}
  const mx=-Math.sin(yaw)*iy+Math.cos(yaw)*ix,mz=-Math.cos(yaw)*iy-Math.sin(yaw)*ix,mv=Math.hypot(mx,mz);
  if(mv>.05){const run=keys.ShiftLeft||keys.ShiftRight||(jid!==null&&l>.9),sv=run?8.5:5;rs=run;P.position.x+=mx*sv*dt;P.position.z+=mz*sv*dt;const ty=Math.atan2(mx,mz);let d=ty-P.rotation.y;d=Math.atan2(Math.sin(d),Math.cos(d));P.rotation.y+=d*Math.min(1,dt*12);sp+=dt*(rs?14:9);stp+=dt;if(stp>(rs?.26:.4)){stp=0;sfx.step()}}else sp=0;
  const px=P.position;px.x=Math.max(-88,Math.min(88,px.x));px.z=Math.max(-100,Math.min(70,px.z));
  for(const o of obs){const dx=px.x-o[0],dz=px.z-o[1],d=Math.hypot(dx,dz),r=o[2]+.45;if(d<r&&d>0){px.x=o[0]+dx/d*r;px.z=o[1]+dz/d*r}}for(const w of wl){const qx=Math.max(w[0],Math.min(px.x,w[2])),qz=Math.max(w[1],Math.min(px.z,w[3])),ex=px.x-qx,ez=px.z-qz,l=Math.hypot(ex,ez);if(l<.5&&l>0){px.x=qx+ex/l*.5;px.z=qz+ez/l*.5}}
  walkAnim(PH,sp,mv>.05?1:0,rs);if(eq!==null&&!dig){PH.pl[3].rotation.x=-1.2;PH.el[1].rotation.x=-.5}
  if(dig){const q=Math.max(0,1-(t-(dig.tm||-9))*2.5);P.rotation.y=Math.atan2(dig.it.x-px.x,dig.it.z-px.z);pl[2].rotation.x=pl[3].rotation.x=-.9-q*.9;tw.visible=true;PH.hand.visible=false;tw.rotation.x=-.6+q*1.1;VM.rotation.x=-q*.8;VM.position.z=-.65-q*.12;tw.children[0].visible=dig.tool!='b';tw.children[1].visible=dig.tool=='b'}else{tw.visible=false;PH.hand.visible=true;VM.rotation.x=0;VM.position.z=-.65;if(vmDig){vmDig=false;pitch=.55;hold()}}
  if(fp){P.visible=false;VM.visible=true;VM.position.y=-.38+Math.sin(sp*2)*.012*(mv>.05?1:0);C.position.set(px.x,2.3+Math.abs(Math.sin(sp))*.06*(mv>.05?1:0),px.z);C.rotation.order='YXZ';C.rotation.set((.55-pitch)*1.3,yaw,0)}else{P.visible=true;VM.visible=false;const dd=8,cy=Math.cos(pitch);C.position.set(px.x+Math.sin(yaw)*dd*cy,px.y+1.8+Math.sin(pitch)*dd,px.z+Math.cos(yaw)*dd*cy);C.lookAt(px.x,1.8,px.z)}
  near=null;for(const it of its)if(!it.done&&it.on!==false){const d=Math.hypot(px.x-it.x,px.z-it.z);if(d<2.8)near=it}
  for(const c of coins)if(c.visible){c.rotation.z=t*3;c.position.y=1.1+Math.sin(t*3)*.15;if(Math.hypot(px.x-c.position.x,px.z-c.position.z)<1.4){c.visible=false;st.score+=25;sfx.coin();hud();if(!coins.some(k=>k.visible))ach('c'+st.lvl,'Colecionador de moedas')}}
  $('#hb').style.display=menu||dig?'none':'flex';{let tg=null;if(!st.tools)tg=its.find(o=>o.k=='t'&&!o.done);else if(!mapF){const ins=Math.abs(P.position.x-MZ[st.lvl][0])<MG2.N*2.6&&Math.abs(P.position.z-MZ[st.lvl][1])<MG2.N*2.6;tg=ins?its.find(o=>o.k=='m'&&!o.done):ENT}else if(found<2)tg=its.find(o=>o.k=='d'&&!o.done);else if(!solved)tg=its.find(o=>o.k=='a');const g=$('#gd');if(tg&&!busy&&!dig){const dx=tg.x-px.x,dz=tg.z-px.z;g.style.display='block';g.innerHTML='<span style="display:inline-block;transform:rotate('+(yaw+Math.PI-Math.atan2(dx,dz))+'rad)">▲</span> '+Math.round(Math.hypot(dx,dz))+' m'}else g.style.display='none'}{const o=eq=='m'&&!menu;$('#mp').style.display=o?'flex':'none';if(o)drawMap();for(const l of FL)l.intensity=.95+Math.sin(t*13+l.position.x)*.2+Math.sin(t*7.3)*.1}const a=$('#act');if(near&&!busy&&!dig){a.style.display='block';a.textContent=near.k=='d'?'⛏️ Escavar'+(touch?'':' [E]'):'🗿 Altar'+(touch?'':' [E]');if(near&&near.k=='t')a.textContent='🛠️ Pegar';if(near&&near.k=='m')a.textContent='🗺️ Pegar mapa'}else a.style.display='none';
  sun.position.set(px.x+34,26,px.z+16);sun.target.position.copy(px);
  const dp=dust.geometry.attributes.position;for(let i=0;i<240;i+=3){dp.array[i]+=dt*.4;dp.array[i+1]=(dp.array[i+1]+dt*.1+50)%12;if(dp.array[i]>25)dp.array[i]-=50}dp.needsUpdate=true;dust.position.set(px.x,0,px.z)}
 for(const it of its)if(!it.done)it.b.material.opacity=.35+Math.sin(t*3)*.15;
 npcStep(dt,t);trapStep(t);mpTick(t,dt);for(let k=fx.length;k--;){const o=fx[k];o.v.y-=9*dt;o.position.addScaledVector(o.v,dt);o.l-=dt;if(o.l<=0){world.remove(o);fx.splice(k,1)}}R.render(S,C)}
load(st.lvl);mainMenu();loop();
</script></body></html>
